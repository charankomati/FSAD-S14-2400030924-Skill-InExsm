services:
  - type: web
    name: auranutrics
    env: node
    buildCommand: "npm install && npm run prisma:push && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
